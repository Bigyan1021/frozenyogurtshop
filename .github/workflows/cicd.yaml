name: Build and Deploy React App to AWS EC2

on:
push:
branches:
- main

jobs:
build-deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Login to Docker Hub
    run: |
      echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
      -u "${{ secrets.DOCKERHUB_USERNAME }}" \
      --password-stdin

  - name: Build Docker Image
    run: |
      docker build -t react-app .

  - name: Tag Docker Image
    run: |
      docker tag react-app:latest \
      ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

  - name: Push Docker Image
    run: |
      docker push \
      ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

  - name: Deploy to AWS EC2
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_PUBLIC_IP }}
      username: ubuntu
      key: ${{ secrets.AWS_SSH_KEY }}
      script: |
        echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKERHUB_USERNAME }}" \
        --password-stdin

        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest

        docker stop react-app || true
        docker rm react-app || true

        docker run -d \
          --name react-app \
          -p 80:80 \
          ${{ secrets.DOCKERHUB_USERNAME }}/react-app:latest
```
